name: BlockWill - Build custom image

# Builds our patched MCP server image on every push to `blockwill`.
# Deploying to the Azure Container App (ca-plane-mcp in rg-mcp-plane) is a
# separate one-liner:
#   az containerapp update -n ca-plane-mcp -g rg-mcp-plane \
#     --image ghcr.io/blockwill-io/plane-mcp-server:blockwill

on:
  push:
    branches:
      - blockwill
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push plane-mcp-server
    runs-on: ubuntu-22.04
    # The `production` environment only admits the blockwill branch, so a
    # manual run from any other branch cannot push the image prod pulls.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blockwill-io/plane-mcp-server:blockwill
            ghcr.io/blockwill-io/plane-mcp-server:blockwill-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
